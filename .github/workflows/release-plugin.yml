name: Release Plugin ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PLUGIN_FILE: atricon-sidebar-menu.php

jobs:
  release:
    name: Build and Release Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract version from plugin file
        id: get_version
        run: |
          VERSION=$(grep -E "^\s*\*\s*Version:\s*" "$PLUGIN_FILE" | awk '{ print $NF }')
          echo "PLUGIN_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Plugin version: $VERSION"

      - name: Set ZIP name
        id: set_zip_name
        run: |
          ZIP_NAME="${PLUGIN_FILE%.php}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Check if tag already exists
        id: tag_check
        run: |
          git fetch --tags
          if git tag | grep -q "^v$PLUGIN_VERSION$"; then
            echo "Tag already exists."
            echo "EXISTS=true" >> $GITHUB_ENV
          else
            echo "EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Create zip file
        run: |
          zip -r "$ZIP_NAME" . -x '*.git*' '*.github*' '*node_modules*' '*.zip'

      - name: Create Git tag
        if: env.EXISTS == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$PLUGIN_VERSION" -m "Release v$PLUGIN_VERSION"
          git push origin "v$PLUGIN_VERSION"

      - name: Create GitHub Release
        if: env.EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PLUGIN_VERSION }}
          name: ${{ env.PLUGIN_FILE }} v${{ env.PLUGIN_VERSION }}
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}